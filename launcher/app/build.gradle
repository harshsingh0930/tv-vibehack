plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 29
        versionCode 24
        versionName '3.12'
        testInstrumentationRunner 'com.gathin.tvhome.DreamFeedChecks'
        manifestPlaceholders = [homeCategory: 'android.intent.category.HOME', launcherLabel: '@string/app_name']
        if (project.hasProperty('occasionPreview')) {
            versionName '3.12-occasion-preview'
            applicationIdSuffix '.occasionpreview'
            manifestPlaceholders = [homeCategory: 'android.intent.category.LEANBACK_LAUNCHER', launcherLabel: 'Occasion Preview']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // This private sideloaded launcher is not submitted to Google Play.
        // Preserve target 29 for the existing Android 11 behaviour; keep runtime API checks enabled.
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
}

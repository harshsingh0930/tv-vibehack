plugins {
    id 'com.android.application'
}

def mountainPreview = providers.gradleProperty('mountainPreview').map { it.toBoolean() }.getOrElse(false)
if (mountainPreview) layout.buildDirectory.set(rootProject.layout.buildDirectory.dir('mountain-preview'))

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId mountainPreview ? 'com.harshsingh.redmiglass.preview' : 'com.harshsingh.redmiglass'
        minSdk 26
        targetSdk 29
        versionCode 25
        versionName '3.12.1'
        manifestPlaceholders = [homeCategory: mountainPreview ? 'android.intent.category.LEANBACK_LAUNCHER' : 'android.intent.category.HOME',
                                launcherLabel: mountainPreview ? 'Mountain Glass Preview' : '@string/app_name']
        resValue 'bool', 'is_preview', mountainPreview.toString()
    }

    signingConfigs {
        publication {
            if (System.getenv('REDMI_GLASS_KEYSTORE')) {
                storeFile file(System.getenv('REDMI_GLASS_KEYSTORE'))
                storePassword System.getenv('REDMI_GLASS_STORE_PASSWORD')
                keyAlias 'redmi-glass'
                keyPassword System.getenv('REDMI_GLASS_STORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('REDMI_GLASS_KEYSTORE')) signingConfig signingConfigs.publication
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/homeThemes'))
}

// Only runtime assets enter the APK; theme documentation and review screenshots stay in Git.
def bundledThemes = tasks.register('bundleHomeThemes', Sync) {
    from('../../themes') { include '*/config.json', '*/wallpaper.jpg' }
    into(layout.buildDirectory.dir('generated/homeThemes'))
}
tasks.named('preBuild').configure { dependsOn(bundledThemes) }

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    testImplementation 'junit:junit:4.13.2'
}
